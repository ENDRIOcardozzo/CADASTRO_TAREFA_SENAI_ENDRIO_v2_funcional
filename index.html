<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Minhas Tarefas</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="cartao">

<header>
<h1>Minhas tarefas</h1>
<button id="tema"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="entrada">
<input id="tarefa" type="text" placeholder="Digite uma nova tarefa...">
<button id="adicionar"><i class="fa-solid fa-plus"></i> Adicionar</button>
</div>

<div class="foto">
<img src="FOTO.jpg" alt="Foto">
</div>

<ul id="lista"></ul>

<footer>
<span id="contador">0 tarefas na lista</span>
</footer>

</div>

<script src="script.js"></script>
</body>
</html>
